name: Bug report
description: Report a problem with scripts, workflows, or the interface.
title: '[Bug] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or workflow inputs and affected deck paths.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python or browser version, and commit or branch; or a GitHub Actions run URL.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private information before posting.
      render: text
