name: Deck tools

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        options: [both, convert, validate]
        default: both
      path:
        description: Deck file or directory, relative to the repository
        type: string
        required: true
        default: decks
      format:
        description: Export format
        type: choice
        options: [ydk, ydke, txt, cod, all]
        default: ydk
      checks:
        description: Validation checks (structure always runs)
        type: choice
        options: [limits, ids, 'ids,limits']
        default: limits
      debug:
        description: Verbose validation output
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deck-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DECK_TARGET: ${{ inputs.path }}
      DECK_FORMAT: ${{ inputs.format }}
      DECK_CHECKS: ${{ inputs.checks }}
      DECK_DEBUG: ${{ inputs.debug }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check target
        id: target
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path('decks').resolve()
          target = Path(os.environ['DECK_TARGET']).resolve()
          if not target.is_relative_to(root):
              raise SystemExit('Path must be inside decks/.')
          files = [target] if target.is_file() else list(target.rglob('*.json'))
          if not any(p.is_file() and p.suffix == '.json' for p in files):
              raise SystemExit('No JSON decks found at the selected path.')
          print(f'Target: {target}')
          PY

      - name: Convert decks
        if: inputs.operation == 'convert' || inputs.operation == 'both'
        run: |
          python scripts/deck-convert.py "$DECK_FORMAT" "$DECK_TARGET" 2>&1 | tee "$RUNNER_TEMP/conversion.log"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          target = Path(os.environ['DECK_TARGET']).resolve()
          root = Path.cwd()
          files = [target] if target.is_file() else sorted(target.rglob('*.json'))
          formats = ('ydk', 'ydke', 'txt', 'cod') if os.environ['DECK_FORMAT'] == 'all' else (os.environ['DECK_FORMAT'],)
          output = Path(os.environ['RUNNER_TEMP']) / 'deck-exports'
          for source in files:
              for fmt in formats:
                  converted = source.with_suffix('.' + fmt)
                  destination = output / converted.relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(converted, destination)
          PY

      - name: Validate decks
        if: ${{ !cancelled() && steps.target.outcome == 'success' && (inputs.operation == 'validate' || inputs.operation == 'both') }}
        run: |
          args=(--check "$DECK_CHECKS")
          if [[ "$DECK_DEBUG" == "true" ]]; then
            args+=(--debug)
          fi
          python scripts/deck-validate.py "${args[@]}" "$DECK_TARGET" 2>&1 | tee "$RUNNER_TEMP/validation.log"

      - name: Upload converted decks
        if: ${{ !cancelled() && (inputs.operation == 'convert' || inputs.operation == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: deck-exports-${{ inputs.format }}
          path: ${{ runner.temp }}/deck-exports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deck-tool-reports
          path: |
            ${{ runner.temp }}/conversion.log
            ${{ runner.temp }}/validation.log
          if-no-files-found: ignore
          retention-days: 14
